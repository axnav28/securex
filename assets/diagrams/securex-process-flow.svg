<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">SecureX operating loop</title>
  <desc id="desc">Five-stage process flow from ingesting security signals to governing investment decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#142b42"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b344d"/><stop offset="1" stop-color="#193047"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#6f9abb"/></marker>
    <style>
      text{font-family:"Helvetica World",Helvetica,Arial,sans-serif}.title{font:700 42px "Helvetica World",Helvetica,Arial,sans-serif;fill:#f3f7fb;letter-spacing:-1px}.sub{font:400 18px "Helvetica World",Helvetica,Arial,sans-serif;fill:#9eb2c5}.eyebrow{font:700 12px "Helvetica World",Helvetica,Arial,sans-serif;fill:#68bfb2;letter-spacing:2px}.num{font:700 13px "Helvetica World",Helvetica,Arial,sans-serif;fill:#74c9bd}.step{font:700 25px "Helvetica World",Helvetica,Arial,sans-serif;fill:#f4f8fb}.copy{font:400 15px "Helvetica World",Helvetica,Arial,sans-serif;fill:#aabccc}.line{fill:none;stroke:#557d9f;stroke-width:3;marker-end:url(#arrow)}.small{font:600 11px "Helvetica World",Helvetica,Arial,sans-serif;fill:#7896ae;letter-spacing:1.2px}
    </style>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <path d="M0 126H1600M0 620H1600" stroke="#24425d" stroke-width="1"/>
  <path d="M0 160H1600M0 190H1600M0 220H1600M0 250H1600M0 280H1600M0 310H1600M0 340H1600M0 370H1600M0 400H1600M0 430H1600M0 460H1600M0 490H1600M0 520H1600M0 550H1600M0 580H1600" stroke="#1b344b" stroke-width="1" opacity=".28"/>
  <text x="92" y="70" class="title">From security noise to a board decision</text>
  <text x="92" y="103" class="sub">SecureX turns connected evidence into a quantified funding path.</text>
  <text x="92" y="157" class="eyebrow">THE SECUREX OPERATING LOOP</text>
  <path d="M120 382H1480" class="line" opacity=".9"/>
  <g filter="url(#shadow)"><rect x="92" y="246" width="254" height="270" rx="18" fill="url(#card)" stroke="#315775"/><rect x="92" y="246" width="254" height="5" rx="2.5" fill="#6b9fd0"/><text x="122" y="292" class="num">01 / SIGNALS</text><text x="122" y="352" class="step">Ingest</text><text x="122" y="395" class="copy">Bring telemetry, assets,</text><text x="122" y="420" class="copy">CVE scans, and controls</text><text x="122" y="445" class="copy">into one evidence layer.</text><circle cx="122" cy="482" r="5" fill="#6b9fd0"/><text x="138" y="486" class="small">NORMALIZE</text></g>
  <g filter="url(#shadow)"><rect x="394" y="246" width="254" height="270" rx="18" fill="url(#card)" stroke="#315775"/><rect x="394" y="246" width="254" height="5" rx="2.5" fill="#54b8aa"/><text x="424" y="292" class="num">02 / EVIDENCE</text><text x="424" y="352" class="step">Verify</text><text x="424" y="395" class="copy">Trace attack paths and</text><text x="424" y="420" class="copy">separate verified from</text><text x="424" y="445" class="copy">estimated reality.</text><circle cx="424" cy="482" r="5" fill="#54b8aa"/><text x="440" y="486" class="small">CONFIDENCE</text></g>
  <g filter="url(#shadow)"><rect x="696" y="246" width="254" height="270" rx="18" fill="url(#card)" stroke="#315775"/><rect x="696" y="246" width="254" height="5" rx="2.5" fill="#d4ae62"/><text x="726" y="292" class="num">03 / EXPOSURE</text><text x="726" y="352" class="step">Quantify</text><text x="726" y="395" class="copy">Use FAIR and Monte</text><text x="726" y="420" class="copy">Carlo to price what</text><text x="726" y="445" class="copy">could happen.</text><circle cx="726" cy="482" r="5" fill="#d4ae62"/><text x="742" y="486" class="small">EXPECTED LOSS</text></g>
  <g filter="url(#shadow)"><rect x="998" y="246" width="254" height="270" rx="18" fill="url(#card)" stroke="#315775"/><rect x="998" y="246" width="254" height="5" rx="2.5" fill="#6b9fd0"/><text x="1028" y="292" class="num">04 / CAPITAL</text><text x="1028" y="352" class="step">Optimize</text><text x="1028" y="395" class="copy">Compare controls by</text><text x="1028" y="420" class="copy">reduction, cost, and</text><text x="1028" y="445" class="copy">return on spend.</text><circle cx="1028" cy="482" r="5" fill="#6b9fd0"/><text x="1044" y="486" class="small">NEXT BEST FIX</text></g>
  <g filter="url(#shadow)"><rect x="1300" y="246" width="208" height="270" rx="18" fill="#193e55" stroke="#3f8f88"/><rect x="1300" y="246" width="208" height="5" rx="2.5" fill="#54b8aa"/><text x="1330" y="292" class="num">05 / ACTION</text><text x="1330" y="352" class="step">Govern</text><text x="1330" y="395" class="copy">Turn the answer</text><text x="1330" y="420" class="copy">into board-ready</text><text x="1330" y="445" class="copy">action.</text><circle cx="1330" cy="482" r="5" fill="#54b8aa"/><text x="1346" y="486" class="small">DECIDE</text></g>
  <g transform="translate(92 656)"><circle cx="7" cy="0" r="5" fill="#54b8aa"/><text x="22" y="4" class="sub">Every signal becomes an evidence-aware investment decision.</text></g>
</svg>
