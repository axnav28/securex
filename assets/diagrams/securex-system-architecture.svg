<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">SecureX simplified system architecture</title>
  <desc id="desc">Simplified architecture showing inputs, core risk quantification, and decision outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfe"/><stop offset="1" stop-color="#eef4fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#294866" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607b95"/></marker>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#17314f;letter-spacing:-.5px}.sub{font:400 13px Inter,Arial,sans-serif;fill:#6b7f94}.head{font:700 10px Inter,Arial,sans-serif;fill:#668098;letter-spacing:1.7px}.t{font:700 15px Inter,Arial,sans-serif;fill:#183651}.c{font:400 11px Inter,Arial,sans-serif;fill:#60748a}.line{fill:none;stroke:#607b95;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.box{stroke-width:1.3}.blue{fill:#e8f2fc;stroke:#bdd2e7}.green{fill:#e8f5ef;stroke:#b9daca}.gold{fill:#fff3d9;stroke:#e4cc91}.purple{fill:#f1eaf8;stroke:#cdbddd}.core{fill:#dfedfa;stroke:#7399bc;stroke-width:2}.dark{fill:#173b61;stroke:#173b61}
    </style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="54" y="52" class="title">SecureX system architecture</text>
  <text x="54" y="77" class="sub">From security signals to an explainable investment decision</text>
  <path d="M54 104H1146" stroke="#d9e4ee"/>

  <text x="70" y="140" class="head">INPUTS</text>
  <text x="450" y="140" class="head">RISK ENGINE</text>
  <text x="880" y="140" class="head">OUTPUTS</text>

  <!-- inputs -->
  <g filter="url(#shadow)">
    <rect x="54" y="166" width="274" height="84" rx="12" class="box blue"/><text x="78" y="201" class="t">Asset Ingestion Pipeline</text><text x="78" y="225" class="c">Telemetry · CVE scans · CMDB</text>
    <rect x="54" y="288" width="274" height="68" rx="12" class="box gold"/><text x="78" y="317" class="t">CISA KEV / EPSS API</text><text x="78" y="339" class="c">Threat likelihood signal</text>
    <rect x="54" y="394" width="274" height="84" rx="12" class="box green"/><text x="78" y="429" class="t">Graph DB</text><text x="78" y="453" class="c">Vulnerability · asset · control paths</text>
    <rect x="54" y="516" width="274" height="68" rx="12" class="box gold"/><text x="78" y="545" class="t">Confidence Tagger</text><text x="78" y="567" class="c">Verified · Configured · Estimated</text>
  </g>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="418" y="166" width="318" height="84" rx="12" class="box core"/><text x="446" y="201" class="t">FAIR Risk Model</text><text x="446" y="225" class="c">Frequency × loss magnitude</text>
    <rect x="418" y="288" width="318" height="84" rx="12" class="box gold"/><text x="446" y="323" class="t">Monte Carlo Simulation</text><text x="446" y="347" class="c">EAL · tail loss · confidence bands</text>
    <rect x="418" y="410" width="318" height="102" rx="12" class="box core"/><text x="446" y="445" class="t">Threat Path Graph</text><text x="446" y="469" class="c">Entry point → asset → control</text><text x="446" y="491" class="c">→ business impact</text>
    <rect x="418" y="550" width="318" height="68" rx="12" class="box green"/><text x="446" y="579" class="t">Investment Optimizer</text><text x="446" y="601" class="c">Gordon–Loeb bounded</text>
  </g>

  <!-- outputs -->
  <g filter="url(#shadow)">
    <rect x="826" y="166" width="320" height="84" rx="12" class="box purple"/><text x="854" y="201" class="t">Threat Path View</text><text x="854" y="225" class="c">Estimated asset–vulnerability paths</text>
    <rect x="826" y="288" width="320" height="84" rx="12" class="box purple"/><text x="854" y="323" class="t">Regulatory Twin Mapping</text><text x="854" y="347" class="c">ISO · NIST · CIS · RBI · SEBI</text>
    <rect x="826" y="410" width="320" height="102" rx="12" class="box dark"/><text x="854" y="445" class="t" fill="#fff">Decision Dashboard</text><text x="854" y="469" class="c" fill="#d8e6f2">Scenarios · reports · audit trail</text><text x="854" y="491" class="c" fill="#a9d8d1">Board-ready action</text>
  </g>

  <!-- connectors -->
  <path d="M328 208H418" class="line"/><path d="M328 322H370V208H418" class="line"/>
  <path d="M328 436H380V461H418" class="line"/><path d="M328 550H380V461H418" class="line dash"/>
  <path d="M577 250V288" class="line"/><path d="M577 372V410" class="line"/><path d="M577 512V550" class="line"/>
  <path d="M736 208H826" class="line"/><path d="M736 461H780V330H826" class="line dash"/><path d="M736 461H826" class="line"/><path d="M736 584H780V461H826" class="line"/>

  <g transform="translate(418 646)"><rect width="728" height="32" rx="16" fill="#e8f5ef" stroke="#b9daca"/><text x="22" y="21" class="c">Core principle: every risk number carries its evidence state.</text></g>
</svg>
